name: Code Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
  
    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        version: "latest"
        python-version: "3.12"
        
    - name: Install dependencies
      run: |
        uv sync --all-extras
        
    - name: Run Black (formatting check)
      run: |
        uvx black --check --diff corehr_pdf_split/ tests/
      continue-on-error: true
        
    - name: Run Ruff (linting)
      run: |
        uvx ruff check corehr_pdf_split/ tests/
      continue-on-error: true
        
    - name: Run Ruff (formatting check)
      run: |
        uvx ruff format --check corehr_pdf_split/ tests/
      continue-on-error: true
        
    - name: Run MyPy (type checking)
      run: |
        uvx mypy corehr_pdf_split/ --ignore-missing-imports
      continue-on-error: true
        
    - name: Run Bandit (security linting)
      run: |
        uvx bandit -r corehr_pdf_split/ -f json -o bandit-report.json
      continue-on-error: true
        
    - name: Run Safety (dependency security check)
      run: |
        uvx safety check --json --output safety-report.json || true
        
    - name: Upload security reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-reports
        path: |
          bandit-report.json
          safety-report.json


  markdown-link-check:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
        
    - name: Run linkspector
      uses: umbrelladocs/action-linkspector@v1
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        reporter: github-pr-review
        fail_on_error: true
